apiVersion: v1
kind: ServiceAccount
metadata:
  name: ship-on-european-kubernetes
  labels:
    app.kubernetes.io/name: ship-on-european-kubernetes
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ship-on-european-kubernetes
  labels:
    app.kubernetes.io/name: ship-on-european-kubernetes
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ship-on-european-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ship-on-european-kubernetes
    spec:
      serviceAccountName: ship-on-european-kubernetes
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: ship-on-european-kubernetes
          image: registry.ankra.cloud/org-359659a8-0e6d-45c2-a57f-0a3a8f9b06ea/ship-on-european-kubernetes:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: uri
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: dbname
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: host
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: password
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: ship-on-european-kubernetes-db-app
                  key: username
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 150
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
